<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Leaf icon -->
  <g transform="translate(4, 8)">
    <ellipse cx="20" cy="22" rx="14" ry="10" fill="url(#grad)" transform="rotate(-30, 20, 22)" opacity="0.9"/>
    <ellipse cx="20" cy="22" rx="10" ry="7" fill="#81C784" transform="rotate(20, 20, 22)" opacity="0.7"/>
    <circle cx="22" cy="28" r="3.5" fill="#FFC107"/>
    <line x1="22" y1="28" x2="22" y2="42" stroke="#4CAF50" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- BRIDFORE text -->
  <text x="52" y="26" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="800" fill="#2E7D32" letter-spacing="3">BRIDFORE</text>
  <!-- Subtitle -->
  <text x="52" y="42" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" letter-spacing="1.5">BRIGHT DREAM FOREST</text>
</svg>
